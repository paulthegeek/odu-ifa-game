<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Practice recognizing Odù Ifá signs on the opẹ̀lẹ̀ and ọpọ́n Ifá." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="pwa-192x192.png" />
    <title>Odù Game</title>
    <script>
      // Apply the theme before first paint so there is no white flash.
      // Keep the storage key in sync with SETTINGS_KEY in src/logic/storage.ts.
      (function () {
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem('odu-practice:settings') || '{}') || {};
        } catch (e) {}
        var t = s.theme;
        if (t !== 'light' && t !== 'dark' && t !== 'night') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-contrast', s.highContrast === true ? 'high' : 'normal');
        r.setAttribute('data-large', String(s.largeText === true));
        r.setAttribute('data-spacing', String(s.dyslexiaSpacing === true));
      })();
    </script>
    <script>
      // On a dropped connection the app script can fail to download, which would leave
      // the loading message up forever. Offer a way to try again instead.
      (function () {
        function showRetry() {
          var loading = document.getElementById('boot-loading');
          var failed = document.getElementById('boot-failed');
          if (!loading || !failed) return false;
          loading.hidden = true;
          failed.hidden = false;
          return true;
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== 'SCRIPT') return;
            if (!showRetry()) document.addEventListener('DOMContentLoaded', showRetry);
          },
          true,
        );
      })();
    </script>
    <style>
      /* data-theme is set by the script above, so without JavaScript only the noscript message shows. */
      html:not([data-theme]) #boot {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- React replaces this when the app starts. -->
    <div id="root">
      <div id="boot" style="font-family: system-ui, sans-serif; padding: 1.5rem">
        <p id="boot-loading" role="status">Loading Odù Game…</p>
        <div id="boot-failed" role="alert" hidden>
          <p>Odù Game couldn’t finish loading. Check your connection, then try again.</p>
          <button
            type="button"
            onclick="location.reload()"
            style="
              font: inherit;
              color: inherit;
              background: transparent;
              border: 1px solid currentColor;
              border-radius: 0.5rem;
              min-height: 44px;
              padding: 0.5rem 1.25rem;
              cursor: pointer;
            "
          >
            Try again
          </button>
        </div>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 1.5rem">
        Odù Game needs JavaScript. If you use Opera Mini, turn off Extreme data savings, or open this page in
        Chrome.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
