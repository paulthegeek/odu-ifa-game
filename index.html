<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practise recognising Odù Ifá signs on the opẹ̀lẹ̀ and ọpọ́n Ifá." />
    <meta name="theme-color" content="#f6f1e7" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="pwa-192x192.png" />
    <title>Odù Practice</title>
    <script>
      // Apply the theme before first paint so there is no white flash.
      // Keep the storage key in sync with SETTINGS_KEY in src/logic/storage.ts.
      (function () {
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem('odu-practice:settings') || '{}') || {};
        } catch (e) {}
        var t = s.theme;
        if (t !== 'light' && t !== 'dark' && t !== 'night') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-contrast', s.highContrast === true ? 'high' : 'normal');
        r.setAttribute('data-large', String(s.largeText === true));
        r.setAttribute('data-spacing', String(s.dyslexiaSpacing === true));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
