    <link rel="canonical" href="https://odugame.com/" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="pwa-192x192.png" />
    <!-- Link previews in chat apps and social sites. The image comes from `pnpm icons`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Odù Game" />
    <meta property="og:title" content="Odù Game: Learn to read Odù Ifá signs" />
    <meta
      property="og:description"
      content="Free practice for reading Odù Ifá signs on the ọpọ́n Ifá and opẹ̀lẹ̀. Learn the 16 principal Odù, then all 256."
    />

      content="The Odù Game logo, a sign drawn on a tray, beside the words Odù Game."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells search engines the site's name and that it is a free learning app. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Odù Game",
            "alternateName": "Odu Game",
            "url": "https://odugame.com/",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "name": "Odù Game",
            "url": "https://odugame.com/",
            "description": "Free practice for reading Odù Ifá signs on the ọpọ́n Ifá and opẹ̀lẹ̀. Learn the 16 principal Odù, then all 256.",
            "image": "https://odugame.com/social-preview.png",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "about": {
              "@type": "Thing",
              "name": "Odù Ifá",
              "sameAs": "https://en.wikipedia.org/wiki/Odu_Ifa"
            }
          }
        ]
      }

    <script>
      // Apply the theme before first paint so there is no white flash.
      // Keep the storage key in sync with SETTINGS_KEY in src/logic/storage.ts.
      (function () {
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem('odu-practice:settings') || '{}') || {};
        } catch (e) {}
        var t = s.theme;
        if (t !== 'light' && t !== 'dark' && t !== 'night') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-contrast', s.highContrast === true ? 'high' : 'normal');
        r.setAttribute('data-large', String(s.largeText === true));
        r.setAttribute('data-spacing', String(s.dyslexiaSpacing === true));
      })();
    </script>
    <script>
      // On a dropped connection the app script can fail to download, which would leave
      // the loading message up forever. Offer a way to try again instead.
      (function () {
        function showRetry() {
          var loading = document.getElementById('boot-loading');
          var failed = document.getElementById('boot-failed');
          if (!loading || !failed) return false;
          loading.hidden = true;
          failed.hidden = false;
          // Count the failure if the analytics script made it through.
          var umamiScript = document.getElementById('umami-script');
          if (window.umami) window.umami.track('boot-failed');
          else if (umamiScript)
            umamiScript.addEventListener('load', function () {
              if (window.umami) window.umami.track('boot-failed');
            });
          return true;
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== 'SCRIPT' || t.id === 'umami-script') return;
            if (!showRetry()) document.addEventListener('DOMContentLoaded', showRetry);
          },
          true,
        );
      })();
    </script>
    <style>
      /* data-theme is set by the script above, so without JavaScript only the noscript message shows. */
      html:not([data-theme]) #boot {
        display: none;
      }
    </style>
    <!-- Anonymous usage counts (umami.is). No cookies. Only runs on odugame.com. -->
    <script
      async
      id="umami-script"
      src="https://cloud.umami.is/script.js"
      data-website-id="7a28f396-a9c2-4f54-a38c-ac70d16ec996"
      data-domains="odugame.com"
      data-auto-pageview="false"
      data-exclude-search="true"
    ></script>
  </head>
  <body>
    <!-- React replaces this when the app starts. -->
    <div id="root">
      <div id="boot" style="font-family: system-ui, sans-serif; padding: 1.5rem">
        <p id="boot-loading" role="status">Loading Odù Game…</p>
        <div id="boot-failed" role="alert" hidden>
          <p>Odù Game couldn’t finish loading. Check your connection, then try again.</p>
          <button
            type="button"
            onclick="location.reload()"
            style="
              font: inherit;
              color: inherit;
              background: transparent;
              border: 1px solid currentColor;
              border-radius: 0.5rem;
              min-height: 44px;
              padding: 0.5rem 1.25rem;
              cursor: pointer;
            "
          >
            Try again
          </button>
        </div>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 1.5rem">
        Odù Game needs JavaScript. If you use Opera Mini, turn off Extreme data savings, or open this page in
        Chrome.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
